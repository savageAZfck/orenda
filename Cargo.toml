[package]
name = "orenda"
version = "0.1.1"
edition = "2021"
rust-version = "1.75"
authors = ["Adam Clark <savagetism@icloud.com>"]
repository = "https://github.com/savageAZfck/orenda"
homepage = "https://github.com/savageAZfck/orenda"
license = "MIT"
description = "Federated cognition pooling: members enroll under owner-held keys, advertise capability, receive deterministic layer/KV shard assignments, and every placement plan is a signed provenance artifact — the pooled power that lives in no single node"
keywords = ["federation", "distributed", "mesh", "kv-cache", "inference"]
categories = ["data-structures"]
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
rand = "0.8"

[features]
default = []
